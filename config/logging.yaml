version: 1
formatters:
  standard:
    format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  application_file:
    class: logging.handlers.RotatingFileHandler
    formatter: standard
    filename: ./logs/application.log
    maxBytes: 10485760
    backupCount: 5
    encoding: utf8
  index_file:
    class: logging.handlers.RotatingFileHandler
    formatter: standard
    filename: ./logs/index.log
    maxBytes: 10485760
    backupCount: 5
    encoding: utf8
  retrieval_file:
    class: logging.handlers.RotatingFileHandler
    formatter: standard
    filename: ./logs/retrieval.log
    maxBytes: 10485760
    backupCount: 5
    encoding: utf8
  generation_file:
    class: logging.handlers.RotatingFileHandler
    formatter: standard
    filename: ./logs/generation.log
    maxBytes: 10485760
    backupCount: 5
    encoding: utf8
  evaluation_file:
    class: logging.handlers.RotatingFileHandler
    formatter: standard
    filename: ./logs/evaluation.log
    maxBytes: 10485760
    backupCount: 5
    encoding: utf8
  errors_file:
    class: logging.handlers.RotatingFileHandler
    formatter: standard
    filename: ./logs/errors.log
    maxBytes: 10485760
    backupCount: 5
    encoding: utf8

loggers:
  application:
    level: INFO
    handlers: [application_file, errors_file]
    propagate: false
  index:
    level: INFO
    handlers: [index_file, errors_file]
    propagate: false
  retrieval:
    level: INFO
    handlers: [retrieval_file, errors_file]
    propagate: false
  generation:
    level: INFO
    handlers: [generation_file, errors_file]
    propagate: false
  evaluation:
    level: INFO
    handlers: [evaluation_file, errors_file]
    propagate: false

root:
  level: INFO
  handlers: [application_file, errors_file]
